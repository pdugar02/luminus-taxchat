<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Code Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e2e5ea;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #1f4e79;
            --accent-dark: #173d5f;
            --accent-soft: #eef3f8;
            --danger: #b3372f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        /* ---------- Header ---------- */

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }

        .header-title h1 {
            font-family: 'Iowan Old Style', 'Palatino', Georgia, serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
        }

        .header-title p {
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
            color: var(--muted);
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
            background: #c8ccd2;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            top: 3px;
            left: 3px;
            transition: transform 0.2s;
        }

        .toggle-switch.active::after {
            transform: translateX(16px);
        }

        .new-chat-btn {
            padding: 7px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .new-chat-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ---------- Chat area ---------- */

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
        }

        .chat-inner {
            max-width: 820px;
            margin: 0 auto;
        }

        .message {
            margin-bottom: 22px;
            animation: fadeIn 0.25s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message.user .message-content {
            max-width: 75%;
            padding: 11px 16px;
            border-radius: 16px 16px 4px 16px;
            background: var(--accent);
            color: white;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.assistant .message-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .answer-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .type-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 9px;
            border-radius: 999px;
        }

        .interpreted-as {
            font-size: 12.5px;
            color: var(--muted);
            font-style: italic;
        }

        /* ---------- Empty state ---------- */

        .empty-state {
            text-align: center;
            padding: 48px 16px 24px;
        }

        .empty-state h2 {
            font-family: 'Iowan Old Style', 'Palatino', Georgia, serif;
            font-size: 26px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--muted);
            font-size: 14.5px;
            margin-bottom: 28px;
        }

        .example-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 680px;
            margin: 0 auto;
        }

        .example-chip {
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 13.5px;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .example-chip:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ---------- Sources ---------- */

        .sources-details {
            margin-top: 14px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .sources-details summary {
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sources-details summary::-webkit-details-marker {
            display: none;
        }

        .sources-details summary::before {
            content: '';
            display: inline-block;
            width: 0;
            height: 0;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 5px solid currentColor;
            transition: transform 0.15s;
        }

        .sources-details[open] summary::before {
            transform: rotate(90deg);
        }

        .sources-details summary:hover {
            color: var(--accent);
        }

        .source {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 12px 14px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 4px;
        }

        .source-id {
            font-weight: 600;
            color: var(--accent);
            font-size: 13.5px;
        }

        .source-heading {
            font-weight: 400;
            color: var(--text);
        }

        .source-score {
            font-size: 11.5px;
            color: var(--muted);
            white-space: nowrap;
        }

        .source-hierarchy {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .source-marker {
            font-weight: 600;
            color: var(--text);
        }

        .source-text-preview,
        .source-text-full {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.55;
        }

        .source-text-full {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .source-text-full.expanded {
            display: block;
        }

        .source-expand-btn {
            display: inline-block;
            margin-top: 8px;
            background: none;
            border: none;
            padding: 0;
            color: var(--accent);
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
        }

        .source-expand-btn:hover {
            text-decoration: underline;
        }

        /* ---------- Loading ---------- */

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 13.5px;
            color: var(--muted);
        }

        .loading-dots span {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            margin: 0 1.5px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ---------- Input bar ---------- */

        .input-container {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 14px 20px 10px;
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper textarea {
            flex: 1;
            padding: 11px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.45;
            outline: none;
            resize: none;
            max-height: 140px;
            transition: border-color 0.2s;
            background: var(--bg);
        }

        .input-wrapper textarea:focus {
            border-color: var(--accent);
            background: var(--surface);
        }

        .input-wrapper button {
            padding: 11px 22px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .input-wrapper button:hover:not(:disabled) {
            background: var(--accent-dark);
        }

        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-wrapper button.stop {
            background: var(--danger);
        }

        .disclaimer {
            max-width: 820px;
            margin: 8px auto 0;
            text-align: center;
            font-size: 11.5px;
            color: var(--muted);
        }

        /* ---------- Markdown inside answers ---------- */

        .message.assistant .message-content h1,
        .message.assistant .message-content h2,
        .message.assistant .message-content h3,
        .message.assistant .message-content h4 {
            margin: 14px 0 6px;
            color: var(--text);
        }

        .message.assistant .message-content p {
            margin: 6px 0;
        }

        .message.assistant .message-content ul,
        .message.assistant .message-content ol {
            margin: 6px 0 6px 22px;
        }

        .message.assistant .message-content li {
            margin: 4px 0;
        }

        .message.assistant .message-content table {
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 13.5px;
            display: block;
            overflow-x: auto;
            max-width: 100%;
        }

        .message.assistant .message-content th,
        .message.assistant .message-content td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .message.assistant .message-content th {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        .message.assistant .message-content tr:nth-child(even) {
            background: var(--bg);
        }

        .message.assistant .message-content code {
            background: var(--bg);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12.5px;
        }

        .message.assistant .message-content pre {
            background: var(--bg);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message.assistant .message-content pre code {
            background: none;
            padding: 0;
        }

        .message.assistant .message-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }

        .message.assistant .message-content blockquote {
            border-left: 3px solid var(--border);
            padding-left: 12px;
            color: var(--muted);
            margin: 8px 0;
        }

        /* ---------- Error / notice ---------- */

        .error {
            color: var(--danger);
            background: #fdf1f0;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #f3cfcc;
            font-size: 14px;
        }

        .notice {
            font-size: 13px;
            font-style: italic;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            .header {
                flex-wrap: wrap;
            }
            .message.user .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <h1>Tax Code Chat</h1>
            <p>Answers from the US Tax Code (Title 26)</p>
        </div>
        <div class="header-actions">
            <div class="toggle-container" title="Skip answer generation and show retrieved sections only">
                <span>Retrieve only</span>
                <div class="toggle-switch" id="retrieveToggle" onclick="toggleRetrieve()"></div>
            </div>
            <button class="new-chat-btn" onclick="newChat()">New chat</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea
                id="questionInput"
                placeholder="Ask a question about the tax code…"
                rows="1"
                onkeydown="handleKeyDown(event)"
                oninput="autoGrow(this)"
            ></textarea>
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
        <div class="disclaimer">Answers are generated from statute text and may contain errors. Informational only — not tax or legal advice.</div>
    </div>

    <script>
        let retrieveOnly = false;
        let sourceCounter = 0;              // unique IDs for expandable source text
        let chatHistory = [];               // [{role: 'user'|'assistant', content: string}, ...]
        let currentController = null;       // AbortController for the in-flight query
        let isQuerying = false;             // true while a query is running (Send acts as Stop)
        let loadingTimer = null;            // interval updating the elapsed-seconds counter

        const EXAMPLE_QUESTIONS = [
            "What tax credits can I claim as a student?",
            "Can I deduct my home office if I use it 60% for business?",
            "Traditional IRA vs. Roth IRA — how do they compare?",
            "What counts as qualified business income?",
            "How do I elect S-corp status?",
        ];

        const TYPE_LABELS = {
            application: "Applied rule",
            survey: "Overview",
            exception: "Limits & exceptions",
            definitional: "Definition",
            procedural: "Procedure",
            comparison: "Comparison",
        };

        function renderEmptyState() {
            const inner = document.getElementById('chatInner');
            const div = document.createElement('div');
            div.className = 'empty-state';
            div.id = 'emptyState';

            let html = '<h2>What can I help you find?</h2>';
            html += '<p>Ask about deductions, credits, filing rules, or any provision of the US Tax Code.</p>';
            html += '<div class="example-chips">';
            EXAMPLE_QUESTIONS.forEach(q => {
                html += `<div class="example-chip" onclick="askExample(this)">${escapeHtml(q)}</div>`;
            });
            html += '</div>';
            div.innerHTML = html;
            inner.appendChild(div);
        }

        function removeEmptyState() {
            const el = document.getElementById('emptyState');
            if (el) el.remove();
        }

        function askExample(chip) {
            const input = document.getElementById('questionInput');
            input.value = chip.textContent;
            sendMessage();
        }

        function newChat() {
            if (isQuerying) stopQuery();
            chatHistory = [];
            document.getElementById('chatInner').innerHTML = '';
            renderEmptyState();
            document.getElementById('questionInput').focus();
        }

        function stopQuery() {
            if (currentController) {
                currentController.abort();
                currentController = null;
            }
        }

        function toggleRetrieve() {
            retrieveOnly = !retrieveOnly;
            document.getElementById('retrieveToggle').classList.toggle('active', retrieveOnly);
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoGrow(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
        }

        async function sendMessage() {
            const input = document.getElementById('questionInput');
            const sendButton = document.getElementById('sendButton');

            // While a query is running the button acts as a Stop control
            if (isQuerying) {
                stopQuery();
                return;
            }

            const question = input.value.trim();
            if (!question) return;

            removeEmptyState();

            // Enter querying state: input disabled, button becomes "Stop"
            isQuerying = true;
            currentController = new AbortController();
            input.disabled = true;
            sendButton.textContent = 'Stop';
            sendButton.classList.add('stop');

            addUserMessage(question);
            input.value = '';
            autoGrow(input);

            const loadingId = addLoadingMessage();

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        retrieve_only: retrieveOnly,
                        history: chatHistory
                    }),
                    signal: currentController.signal
                });

                const data = await response.json();

                removeMessage(loadingId);

                if (response.ok) {
                    addAssistantMessage(question, data);
                    // Record the turn so follow-up questions carry context
                    chatHistory.push({role: 'user', content: question});
                    chatHistory.push({role: 'assistant', content: data.answer});
                } else {
                    addErrorMessage(data.error || 'An error occurred');
                }
            } catch (error) {
                removeMessage(loadingId);
                if (error.name === 'AbortError') {
                    addNoticeMessage('Query stopped. Ready for a new question.');
                } else {
                    addErrorMessage('Failed to connect to server: ' + error.message);
                }
            } finally {
                // Leave querying state: restore input and the Send button
                isQuerying = false;
                currentController = null;
                input.disabled = false;
                sendButton.textContent = 'Send';
                sendButton.classList.remove('stop');
                input.focus();
            }
        }

        function addUserMessage(text) {
            const inner = document.getElementById('chatInner');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);
            inner.appendChild(messageDiv);
            scrollToBottom();
        }

        function addLoadingMessage() {
            const inner = document.getElementById('chatInner');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'loading-message';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML =
                '<span class="loading-dots"><span></span><span></span><span></span></span>' +
                '<span id="loadingStatus">Searching the tax code… <span id="loadingElapsed">0s</span></span>';

            messageDiv.appendChild(loadingDiv);
            inner.appendChild(messageDiv);
            scrollToBottom();

            const start = Date.now();
            loadingTimer = setInterval(() => {
                const elapsedEl = document.getElementById('loadingElapsed');
                if (!elapsedEl) return;
                const secs = Math.round((Date.now() - start) / 1000);
                elapsedEl.textContent = secs + 's';
                const statusEl = document.getElementById('loadingStatus');
                if (statusEl && secs >= 10) {
                    statusEl.firstChild.textContent = 'Reading relevant sections and writing an answer… ';
                }
            }, 1000);

            return 'loading-message';
        }

        function removeMessage(id) {
            if (loadingTimer) {
                clearInterval(loadingTimer);
                loadingTimer = null;
            }
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        function addAssistantMessage(originalQuestion, data) {
            const inner = document.getElementById('chatInner');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // Meta row: question-type badge + condensed-question note (follow-ups only)
            const metaBits = [];
            if (data.question_type && TYPE_LABELS[data.question_type]) {
                metaBits.push(`<span class="type-badge">${TYPE_LABELS[data.question_type]}</span>`);
            }
            if (data.standalone_question && data.standalone_question !== originalQuestion) {
                metaBits.push(`<span class="interpreted-as">Interpreted as: “${escapeHtml(data.standalone_question)}”</span>`);
            }

            let html = '';
            if (metaBits.length) {
                html += `<div class="answer-meta">${metaBits.join('')}</div>`;
            }
            html += marked.parse(data.answer || '');
            contentDiv.innerHTML = html;

            // Collapsible sources under the answer
            const sources = data.sources || [];
            if (sources.length > 0) {
                const details = document.createElement('details');
                details.className = 'sources-details';
                if (retrieveOnly) details.open = true;

                const summary = document.createElement('summary');
                summary.textContent = `Sources · ${sources.length} section${sources.length === 1 ? '' : 's'}`;
                details.appendChild(summary);

                sources.forEach(source => {
                    details.appendChild(buildSourceCard(source));
                });
                contentDiv.appendChild(details);
            }

            messageDiv.appendChild(contentDiv);
            inner.appendChild(messageDiv);
            scrollToBottom();
        }

        function buildSourceCard(source) {
            const meta = source.metadata || {};
            const text = cleanSourceText(source.text || '', meta);
            const previewLength = 200;
            const hasMoreText = text.length > previewLength;
            const previewText = hasMoreText ? text.substring(0, previewLength) : text;
            const uniqueId = sourceCounter++;

            const sourceDiv = document.createElement('div');
            sourceDiv.className = 'source';

            let heading = '';
            if (meta.heading && meta.heading !== 'N/A') {
                heading = ` <span class="source-heading">— ${escapeHtml(meta.heading)}</span>`;
            }

            let html = '<div class="source-header">';
            html += `<span class="source-id">§ ${escapeHtml(sourceLabel(meta))}${heading}</span>`;
            if (source.score != null) {
                html += `<span class="source-score" title="Retrieval relevance score">${Number(source.score).toFixed(3)}</span>`;
            }
            html += '</div>';
            if (meta.hierarchy_path) {
                html += `<div class="source-hierarchy">${escapeHtml(meta.hierarchy_path)}</div>`;
            }
            html += `<div class="source-text-preview">${formatSourceText(previewText)}${hasMoreText ? '…' : ''}</div>`;
            html += `<div class="source-text-full" id="source-full-${uniqueId}">${formatSourceText(text)}</div>`;
            if (hasMoreText) {
                html += `<button class="source-expand-btn" onclick="toggleSource(${uniqueId}, this)">Show full text</button>`;
            }
            sourceDiv.innerHTML = html;
            return sourceDiv;
        }

        // Header label: section number plus the subsection range this chunk covers,
        // e.g. "179(a)–(b)(5)" for a chunk spanning (a) through (b)(5).
        function sourceLabel(meta) {
            const id = String(meta.identifier || '?');
            const subs = meta.subsections || [];
            if (subs.length === 0) return id;
            if (subs.length === 1) return id + subs[0];
            return `${id}${subs[0]}–${subs[subs.length - 1]}`;
        }

        // Strip the retrieval prefix ("§179 Heading [hierarchy]: ") and the section's
        // own re-opened heading ("§ 179. Heading: ") — both duplicate the card header.
        function cleanSourceText(text, meta) {
            let body = text.replace(/^§.{0,400}?\]:\s*/, '');
            const id = String(meta.identifier || '');
            const heading = meta.heading || '';
            if (id && heading) {
                const reopen = new RegExp(
                    '^§\\s?' + escapeRegex(id) + '\\.?\\s*' + escapeRegex(heading) + ':?\\s*', 'i'
                );
                body = body.replace(reopen, '');
            }
            return body;
        }

        // Bold structural markers like "(a)" or "(b)(3)(B)(ii)(I)" when they open a new
        // unit (start of text or after punctuation), and start a new line at top-level
        // subsections so the statute structure is scannable.
        function formatSourceText(text) {
            const escaped = escapeHtml(text);
            const group = '\\((?:[a-z]{1,3}|[A-Z]{1,3}|\\d{1,2})\\)';
            const re = new RegExp(
                '(^|[:.;—]\\s+|,?\\s+(?:or|and)\\s+)((?:' + group + '){1,6})(?=\\s|$)', 'g'
            );
            return escaped.replace(re, (m, pre, marker) => {
                const depth = (marker.match(/\(/g) || []).length;
                // after "or"/"and", only full-path markers are structural — bare "(2)"
                // there is a cross-reference ("paragraphs (1) and (2)"), leave it alone
                if (/(?:or|and)\s+$/.test(pre) && depth < 2) return m;
                const topLevel = /^\([a-z]\)(\(\d{1,2}\))?$/.test(marker);
                const lead = (topLevel && pre !== '') ? pre.trimEnd() + '<br>' : pre;
                return `${lead}<span class="source-marker">${marker}</span>`;
            });
        }

        function escapeRegex(s) {
            return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function toggleSource(uniqueId, btn) {
            const fullTextDiv = document.getElementById(`source-full-${uniqueId}`);
            if (!fullTextDiv) return;
            const expanded = fullTextDiv.classList.toggle('expanded');
            btn.textContent = expanded ? 'Hide full text' : 'Show full text';
        }

        function addErrorMessage(error) {
            const inner = document.getElementById('chatInner');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = 'Error: ' + error;

            messageDiv.appendChild(errorDiv);
            inner.appendChild(messageDiv);
            scrollToBottom();
        }

        function addNoticeMessage(text) {
            const inner = document.getElementById('chatInner');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const noticeDiv = document.createElement('div');
            noticeDiv.className = 'notice';
            noticeDiv.textContent = '⏹ ' + text;

            messageDiv.appendChild(noticeDiv);
            inner.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        renderEmptyState();
        document.getElementById('questionInput').focus();
    </script>
</body>
</html>
