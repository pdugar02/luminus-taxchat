<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Code RAG Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message.assistant {
            text-align: left;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chunks-section {
            margin-top: 15px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .chunks-section h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chunk {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .chunk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .chunk-id {
            font-weight: 600;
            color: #667eea;
            font-size: 13px;
        }

        .chunk-score {
            font-size: 12px;
            color: #666;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .chunk-heading {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-style: italic;
        }

        .chunk-text {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .chunk-text-preview {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .chunk-text-full {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .chunk-text-full.expanded {
            display: block;
        }

        .chunk-expand-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 6px 12px;
            background: #f0f4ff;
            border: 1px solid #667eea;
            border-radius: 6px;
            color: #667eea;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .chunk-expand-btn:hover {
            background: #e0e8ff;
            transform: translateY(-1px);
        }

        .chunk-expand-btn.expanded {
            background: #667eea;
            color: white;
        }

        .chunk-expand-btn.expanded:hover {
            background: #5568d3;
        }

        .expand-arrow {
            display: inline-block;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid currentColor;
            transition: transform 0.2s;
        }

        .chunk-expand-btn.expanded .expand-arrow {
            transform: rotate(180deg);
        }

        .loading {
            display: inline-block;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-container {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
        }

        .input-wrapper button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-wrapper button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .input-wrapper button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-wrapper button.stop {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #666;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #ccc;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: #667eea;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .message.assistant .message-content h1,
        .message.assistant .message-content h2,
        .message.assistant .message-content h3,
        .message.assistant .message-content h4 {
            margin: 12px 0 6px;
            color: #333;
        }

        .message.assistant .message-content p {
            margin: 6px 0;
            line-height: 1.6;
        }

        .message.assistant .message-content ul,
        .message.assistant .message-content ol {
            margin: 6px 0 6px 20px;
        }

        .message.assistant .message-content li {
            margin: 4px 0;
            line-height: 1.5;
        }

        .message.assistant .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 13px;
        }

        .message.assistant .message-content th,
        .message.assistant .message-content td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        .message.assistant .message-content th {
            background: #f0f4ff;
            color: #667eea;
            font-weight: 600;
        }

        .message.assistant .message-content tr:nth-child(even) {
            background: #fafafa;
        }

        .message.assistant .message-content code {
            background: #f0f0f0;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }

        .message.assistant .message-content pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message.assistant .message-content pre code {
            background: none;
            padding: 0;
        }

        .message.assistant .message-content hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 12px 0;
        }

        .message.assistant .message-content strong {
            color: #222;
        }

        .error {
            color: #e74c3c;
            background: #fee;
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid #fcc;
        }

        .sources-section {
            margin-top: 15px;
            padding: 15px;
            background: #fff9e6;
            border-radius: 12px;
            border-left: 4px solid #f39c12;
        }

        .sources-section h4 {
            color: #f39c12;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .source {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Tax Code RAG Chat</h1>
            <p>Ask questions about the US Tax Code (Title 26)</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-content">
                    👋 Hello! I can help you find information in the US Tax Code. 
                    Ask me anything about tax rates, deductions, filing requirements, and more.
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="toggle-container">
                <span>Retrieve Only (no LLM):</span>
                <div class="toggle-switch" id="retrieveToggle" onclick="toggleRetrieve()"></div>
            </div>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask a question about the tax code..."
                    onkeypress="handleKeyPress(event)"
                >
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let retrieveOnly = false;
        let chunkCounter = 0; // Global counter for unique chunk IDs
        let chatHistory = []; // [{role: 'user'|'assistant', content: string}, ...]
        let currentController = null; // AbortController for the in-flight query
        let isQuerying = false; // true while a query is running (Send acts as Stop)

        function stopQuery() {
            if (currentController) {
                currentController.abort();
                currentController = null;
            }
        }

        function toggleRetrieve() {
            retrieveOnly = !retrieveOnly;
            const toggle = document.getElementById('retrieveToggle');
            if (retrieveOnly) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('questionInput');
            const sendButton = document.getElementById('sendButton');

            // While a query is running the button acts as a Stop control
            if (isQuerying) {
                stopQuery();
                return;
            }

            const question = input.value.trim();
            if (!question) return;

            // Enter querying state: input disabled, button becomes "Stop"
            isQuerying = true;
            currentController = new AbortController();
            input.disabled = true;
            sendButton.textContent = 'Stop';
            sendButton.classList.add('stop');

            // Add user message
            addMessage(question, 'user');

            // Clear input
            input.value = '';

            // Add loading message
            const loadingId = addLoadingMessage();

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        retrieve_only: retrieveOnly,
                        history: chatHistory
                    }),
                    signal: currentController.signal
                });

                const data = await response.json();

                // Remove loading message
                removeMessage(loadingId);

                if (response.ok) {
                    // Add assistant response
                    addAssistantMessage(data.answer, data.chunks || [], data.sources || []);
                    // Record the turn so follow-up questions carry context
                    chatHistory.push({role: 'user', content: question});
                    chatHistory.push({role: 'assistant', content: data.answer});
                } else {
                    addErrorMessage(data.error || 'An error occurred');
                }
            } catch (error) {
                removeMessage(loadingId);
                if (error.name === 'AbortError') {
                    addNoticeMessage('Query stopped. Ready for a new question.');
                } else {
                    addErrorMessage('Failed to connect to server: ' + error.message);
                }
            } finally {
                // Leave querying state: restore input and the Send button
                isQuerying = false;
                currentController = null;
                input.disabled = false;
                sendButton.textContent = 'Send';
                sendButton.classList.remove('stop');
                input.focus();
            }
        }

        function addMessage(text, type) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            container.appendChild(messageDiv);
            scrollToBottom();
            
            return messageDiv;
        }

        function addLoadingMessage() {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'loading-message';
            
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div> Searching and generating answer...';
            
            messageDiv.appendChild(loadingDiv);
            container.appendChild(messageDiv);
            scrollToBottom();
            
            return 'loading-message';
        }

        function removeMessage(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        function addAssistantMessage(answer, chunks, sources) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = marked.parse(answer);
            
            messageDiv.appendChild(contentDiv);

            // Add chunks if available
            if (chunks && chunks.length > 0) {
                const chunksSection = document.createElement('div');
                chunksSection.className = 'chunks-section';
                chunksSection.innerHTML = '<h4>📄 Retrieved Chunks</h4>';
                
                chunks.forEach((chunk, idx) => {
                    const chunkDiv = document.createElement('div');
                    chunkDiv.className = 'chunk';
                    const uniqueChunkId = chunkCounter++;
                    chunkDiv.id = `chunk-${uniqueChunkId}`;
                    
                    const previewLength = 200;
                    const hasMoreText = chunk.text.length > previewLength;
                    const previewText = hasMoreText ? chunk.text.substring(0, previewLength) : chunk.text;
                    
                    let html = '<div class="chunk-header">';
                    html += `<span class="chunk-id">[${idx + 1}] §${chunk.metadata.identifier || 'null'} | ${chunk.metadata.tag || 'null'}</span>`;
                    if (chunk.score) {
                        html += `<span class="chunk-score">Score: ${chunk.score.toFixed(3)}</span>`;
                    }
                    html += '</div>';
                    
                    if (chunk.metadata.heading && chunk.metadata.heading !== 'N/A' && chunk.metadata.heading !== null) {
                        html += `<div class="chunk-heading">${escapeHtml(chunk.metadata.heading)}</div>`;
                    }
                    
                    // Preview text
                    html += `<div class="chunk-text-preview">${escapeHtml(previewText)}${hasMoreText ? '...' : ''}</div>`;
                    
                    // Full text (hidden by default)
                    html += `<div class="chunk-text-full" id="chunk-full-${uniqueChunkId}">${escapeHtml(chunk.text)}</div>`;
                    
                    // Expand button (only show if there's more text)
                    if (hasMoreText) {
                        html += `<div class="chunk-expand-btn" onclick="toggleChunk(${uniqueChunkId})" id="chunk-btn-${uniqueChunkId}">`;
                        html += '<span class="expand-arrow"></span>';
                        html += '<span class="expand-text">Show full text</span>';
                        html += '</div>';
                    }
                    
                    chunkDiv.innerHTML = html;
                    chunksSection.appendChild(chunkDiv);
                });
                
                messageDiv.appendChild(chunksSection);
            }

            // Add sources if available (render with same expandable UI as chunks)
            if (sources && sources.length > 0) {
                const sourcesSection = document.createElement('div');
                sourcesSection.className = 'sources-section';
                sourcesSection.innerHTML = '<h4>📚 Sources</h4>';
                
                const previewLength = 200;
                sources.forEach((source, idx) => {
                    const text = source.text || '';
                    const hasMoreText = text.length > previewLength;
                    const previewText = hasMoreText ? text.substring(0, previewLength) : text;
                    const uniqueId = chunkCounter++;
                    
                    const sourceDiv = document.createElement('div');
                    sourceDiv.className = 'chunk'; // reuse chunk styles and expand behavior
                    sourceDiv.id = `chunk-${uniqueId}`;
                    
                    const meta = source.metadata || {};
                    let html = '<div class="chunk-header">';
                    html += `<span class="chunk-id">[${idx + 1}] §${meta.identifier || 'null'} | ${meta.tag || 'null'}</span>`;
                    if (source.score != null) {
                        html += `<span class="chunk-score">Score: ${Number(source.score).toFixed(3)}</span>`;
                    }
                    html += '</div>';
                    if (meta.heading && meta.heading !== 'N/A' && meta.heading !== null) {
                        html += `<div class="chunk-heading">${escapeHtml(meta.heading)}</div>`;
                    }
                    html += `<div class="chunk-text-preview">${escapeHtml(previewText)}${hasMoreText ? '...' : ''}</div>`;
                    html += `<div class="chunk-text-full" id="chunk-full-${uniqueId}">${escapeHtml(text)}</div>`;
                    if (hasMoreText) {
                        html += `<div class="chunk-expand-btn" onclick="toggleChunk(${uniqueId})" id="chunk-btn-${uniqueId}">`;
                        html += '<span class="expand-arrow"></span>';
                        html += '<span class="expand-text">Show full text</span>';
                        html += '</div>';
                    }
                    sourceDiv.innerHTML = html;
                    sourcesSection.appendChild(sourceDiv);
                });
                
                messageDiv.appendChild(sourcesSection);
            }
            
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addErrorMessage(error) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = '❌ Error: ' + error;
            
            messageDiv.appendChild(errorDiv);
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addNoticeMessage(text) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const noticeDiv = document.createElement('div');
            noticeDiv.style.opacity = '0.6';
            noticeDiv.style.fontStyle = 'italic';
            noticeDiv.textContent = '⏹ ' + text;

            messageDiv.appendChild(noticeDiv);
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleChunk(uniqueId) {
            const fullTextDiv = document.getElementById(`chunk-full-${uniqueId}`);
            const expandBtn = document.getElementById(`chunk-btn-${uniqueId}`);
            
            if (!fullTextDiv || !expandBtn) return;
            
            const expandText = expandBtn.querySelector('.expand-text');
            
            if (fullTextDiv.classList.contains('expanded')) {
                // Collapse
                fullTextDiv.classList.remove('expanded');
                expandBtn.classList.remove('expanded');
                expandText.textContent = 'Show full text';
            } else {
                // Expand
                fullTextDiv.classList.add('expanded');
                expandBtn.classList.add('expanded');
                expandText.textContent = 'Hide full text';
            }
        }

        // Focus input on load
        document.getElementById('questionInput').focus();
    </script>
</body>
</html>
